# Postgres 17 for the e2e suite. Pinned (never `latest`), matching the integration
# test image (Tech-Backend §7). The port and database come from .env.e2e.
services:
  postgres:
    image: postgres:17
    container_name: studentportal-e2e-db
    environment:
      POSTGRES_DB: ${E2E_POSTGRES_DB:-studentportal_e2e}
      POSTGRES_USER: ${E2E_POSTGRES_USER:-e2e}
      POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD:-e2e}
    ports:
      - "${E2E_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${E2E_POSTGRES_USER:-e2e} -d ${E2E_POSTGRES_DB:-studentportal_e2e}"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
